# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Build CV and deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      # --- Rebuild the CV PDF and the Publications page from files/myCV.bib ---
      # If either fails (e.g. a malformed .bib entry), the site still deploys using
      # the versions already committed, and the run is flagged with a warning.
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("rmarkdown", "RefManageR"))'
      - name: Render CV
        id: cv
        continue-on-error: true
        working-directory: files
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: Rscript -e 'rmarkdown::render("ward_cv_markdown.Rmd", output_format = "pdf_document")'
      - name: Build Publications page
        id: pubs
        continue-on-error: true
        working-directory: files
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: Rscript build_publications.R
      - name: Warn if Publications page failed to build
        if: steps.pubs.outcome == 'failure'
        run: echo "::warning title=Publications page not rebuilt::files/build_publications.R failed; the site was deployed with the previously committed _pages/publications.md. See the 'Build Publications page' step log."
      - name: Warn if CV failed to render
        if: steps.cv.outcome == 'failure'
        run: echo "::warning title=CV not rebuilt::Rendering files/ward_cv_markdown.Rmd failed; the site was deployed with the previously committed PDF. See the 'Render CV' step log."
      - name: Upload CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: files/ward_cv_markdown.pdf
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
